{% extends "base.html" %}

{% block title %}Erişim yok · Kararsızım{% endblock %}

{% block content %}

    <p class="error-page__code num" aria-hidden="true">403</p>
    <h1 class="error-page__title">Bunu yapma iznin yok.</h1>
    <p class="error-page__text">{% block reason %}Bu işlemi sadece anketin sahibi yapabilir.{% endblock %}</p>
    <a class="btn btn-primary" href="{% url 'polls:index' %}">Ana sayfaya dön</a>
  </section>
{% endblock %}
