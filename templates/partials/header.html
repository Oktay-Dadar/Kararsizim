<header class="site-header">
  <a class="site-logo" href="{% url 'polls:index' %}">Kararsızım</a>
  <nav class="site-nav" aria-label="Hesap">
    {% if user.is_authenticated %}
      <a class="site-nav__user" href="{% url 'polls:profile' user.username %}">@{{ user.username }}</a>
      <a class="btn btn-primary" href="{% url 'polls:create' %}">Anket oluştur</a>
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button class="btn btn-secondary" type="submit">Çıkış yap</button>
      </form>
    {% else %}
      <a class="btn btn-secondary" href="{% url 'accounts:login' %}">Giriş yap</a>
      <a class="btn btn-primary" href="{% url 'accounts:register' %}">Kayıt ol</a>
    {% endif %}
  </nav>
</header>
