{% load static %}<header class="site-header">
  <a class="skip-link" href="#main">İçeriğe geç</a>
  <a class="site-logo" href="{% url 'polls:index' %}">
    <img class="site-logo__mark" src="{% static 'img/logo.svg' %}" alt="" width="28" height="28">
    <span class="site-logo__text">Kararsızım</span>
  </a>
  <nav class="site-nav" aria-label="Hesap">
    {% if user.is_authenticated %}
      <a class="btn btn-primary" href="{% url 'polls:create' %}">Anket oluştur</a>
      <details class="account-menu">
        <summary class="account-menu__trigger">
          <span class="account-menu__avatar" aria-hidden="true">{{ user.username|first|upper }}</span>
          <span class="account-menu__name">@{{ user.username }}</span>
        </summary>
        <div class="account-menu__panel">
          <a class="account-menu__item" href="{% url 'polls:profile' user.username %}">Profilim</a>
          <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button class="account-menu__item" type="submit">Çıkış yap</button>
          </form>
        </div>
      </details>
    {% else %}
      <a class="btn btn-secondary" href="{% url 'accounts:login' %}">Giriş yap</a>
      <a class="btn btn-primary" href="{% url 'accounts:register' %}">Kayıt ol</a>
    {% endif %}
  </nav>
</header>
