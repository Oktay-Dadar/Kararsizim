<li class="option-row opt-{{ option.position }}{% if option.percent is not None %} option-row--result{% endif %}">
  {% if option.percent is not None %}<span class="option-row__fill" style="width: {{ option.percent }}%"></span>{% endif %}
  <span class="option-row__text">{{ option.text }}</span>
  {% if option.percent is not None %}<span class="option-row__percent">%{{ option.percent }}</span>{% endif %}
</li>
