{% load static %}<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kararsızım · Sen sor, kalabalık karar versin.{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Kararsız kaldığın konuyu küçük bir ankete dönüştür, kalabalık oylasın.{% endblock %}">

  <meta property="og:site_name" content="Kararsızım">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:title" content="{% block og_title %}Kararsızım · Sen sor, kalabalık karar versin.{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Kararsız kaldığın konuyu küçük bir ankete dönüştür, kalabalık oylasın.{% endblock %}">
  {% if request %}
    <meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
    <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'img/og-image.png' %}">
  {% endif %}
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Kararsızım: Sen sor, kalabalık karar versin.">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
  <link rel="preload" href="{% static 'fonts/inter-latin-400-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{% static 'fonts/bricolage-grotesque-latin-800-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/fonts.css' %}">
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <script src="{% static 'js/toast.js' %}" defer></script>
</head>
<body>
  {% include "partials/header.html" %}
  <main id="main" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  {% include "partials/toast.html" %}
</body>
</html>
